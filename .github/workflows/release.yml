# Push a tag like v2.0.0 to build every package and publish a GitHub release.
#
# Always built and attached to the GitHub release:
#   Python wheel + sdist, .deb, .snap, Windows .exe zip + installer
#
# Optional publishing, switched on with repository variables / secrets
# (Settings → Secrets and variables → Actions):
#   PyPI        variable PUBLISH_PYPI=true, plus a PyPI "trusted publisher"
#               for this repo/workflow with environment "pypi"
#   Snap Store  secret SNAPCRAFT_STORE_CREDENTIALS (snapcraft export-login -)
#   apt repo    variable PUBLISH_APT=true, secret APT_GPG_PRIVATE_KEY (armored)
#               and GitHub Pages serving the gh-pages branch
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - id: v
        run: |
          ver=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/librestatistics/__init__.py)
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$ver" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version $ver (run scripts/bump_version.py)"
            exit 1
          fi

  python:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python
          path: dist/*

  deb:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools
          dpkg-buildpackage -us -uc -b
          mkdir -p out && mv ../librestatistics_*.deb out/
      - name: Install and smoke test
        env:
          COLUMNS: "120"
          LINES: "35"
        run: |
          sudo apt-get install -y ./out/librestatistics_*.deb
          librestatistics --once && librestatistics-dev --once && librestatistics-classic --once
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deb
          path: out/*.deb

  snap:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1
        id: build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
      - name: Check for Snap Store credentials
        id: store
        run: echo "enabled=${{ secrets.SNAPCRAFT_STORE_CREDENTIALS != '' }}" >> "$GITHUB_OUTPUT"
      - name: Publish to the Snap Store (stable)
        if: steps.store.outputs.enabled == 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40 # v1
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: stable

  windows:
    needs: version
    runs-on: windows-latest
    env:
      COLUMNS: "120"
      LINES: "35"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build executables, zip and installer
        shell: pwsh
        run: ./packaging/windows/build.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: |
            dist/windows/*.zip
            dist/windows/*-setup.exe

  github-release:
    needs: [version, python, deb, snap, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: librestatistics ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*

  pypi:
    needs: [python, github-release]
    if: github.ref_type == 'tag' && vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  apt-repo:
    needs: [deb, github-release]
    if: github.ref_type == 'tag' && vars.PUBLISH_APT == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: deb
          path: new
      - name: Import signing key
        id: gpg
        env:
          KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$KEY" | gpg --batch --import
          echo "id=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')" >> "$GITHUB_OUTPUT"
      - name: Update gh-pages apt repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin gh-pages; then
            git worktree add site origin/gh-pages && git -C site switch -c gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi
          packaging/apt/build-repo.sh site/apt "${{ steps.gpg.outputs.id }}" new/*.deb
          git -C site add -A
          git -C site commit -m "apt: librestatistics ${{ needs.version.outputs.version }}"
          git -C site push origin gh-pages
