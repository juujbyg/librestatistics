name: librestatistics
base: core24
version: '2.0.0'
summary: Live CPU, memory and GPU dashboards for the terminal
description: |
  LibreStatistics shows how busy your computer is, live, in the terminal.
  It comes in three editions:

  * librestatistics          friendly edition: plain language, big numbers, apps
                             grouped by name and helpful tips
  * librestatistics.dev      developer edition: per-core breakdown, disk, network,
                             pressure stalls, GPU engines, sortable process table
  * librestatistics.classic  the original v1.0 overview

  After installing, allow it to read system statistics:

    sudo snap connect librestatistics:system-observe
    sudo snap connect librestatistics:hardware-observe
    sudo snap connect librestatistics:mount-observe
    sudo snap connect librestatistics:network-observe
license: GPL-2.0-or-later
website: https://github.com/juujbyg/librestatistics
source-code: https://github.com/juujbyg/librestatistics
issues: https://github.com/juujbyg/librestatistics/issues
icon: snap/gui/librestatistics.svg
grade: stable
confinement: strict
platforms:
  amd64:
  arm64:

# system-observe: processes and /proc stats · hardware-observe: sensors, GPU sysfs, battery
# mount-observe: filesystem usage · network-observe: network counters, TCP states
apps:
  librestatistics:
    command: bin/librestatistics
    desktop: snap/gui/librestatistics.desktop
    plugs: [system-observe, hardware-observe, mount-observe, network-observe]
  dev:
    command: bin/librestatistics-dev
    desktop: snap/gui/dev.desktop
    plugs: [system-observe, hardware-observe, mount-observe, network-observe]
  classic:
    command: bin/librestatistics-classic
    plugs: [system-observe, hardware-observe, mount-observe, network-observe]

parts:
  librestatistics:
    plugin: python
    source: .
