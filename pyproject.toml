[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "librestatistics"
dynamic = ["version"]
description = "Live CPU, memory and GPU dashboards for the terminal: friendly, developer and classic editions"
readme = "README.md"
license = { text = "GPL-2.0-or-later" }
authors = [{ name = "LibreStatistics contributors" }]
requires-python = ">=3.9"
dependencies = ["psutil>=5.9", "rich>=13"]
keywords = ["monitor", "cpu", "gpu", "memory", "tui", "dashboard", "system"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

[project.urls]
Homepage = "https://github.com/juujbyg/librestatistics"
Issues = "https://github.com/juujbyg/librestatistics/issues"

[project.scripts]
librestatistics = "librestatistics.friendly:main"
librestatistics-dev = "librestatistics.dev:main"
librestatistics-classic = "librestatistics.classic:main"

[tool.setuptools.dynamic]
version = { attr = "librestatistics.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
